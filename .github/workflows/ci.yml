name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,ml,api]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest
      - name: Smoke-run CLI
        run: |
          antroute validate-config
          antroute demo --departure 2026-12-20 --resolution-km 25 --scenarios 80 --out artifacts/ci-demo

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t antarctic-routing:ci .
      - name: Smoke-test container
        run: |
          docker run -d --name antroute -p 8000:8000 antarctic-routing:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' antroute)" != "true" ]; then
              echo "::error::container stopped during start-up"; exit 1
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8000/ | grep -q "Antarctic Ice-Risk Routing"
          curl -fsS -X POST "http://127.0.0.1:8000/routes?wait=true" -H 'Content-Type: application/json' \
            -d '{"departure":"2027-01-10","scenarios":80,"resolution_km":25,"scenario_routes":0}' | grep -q '"status":"done"'
          docker logs antroute | tail -20
      - name: Container state and logs on failure
        if: failure()
        run: |
          docker ps -a
          docker inspect antroute --format '{{.State.Status}} {{.State.ExitCode}} {{.State.Error}}' || true
          docker logs antroute 2>&1 || true
      - name: Remove container
        if: always()
        run: docker rm -f antroute || true
